<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div id="status" class="status off" title="">
      <span id="statusIcon" class="dot"></span><span id="statusText"></span>
    </div>
    <div id="btnSettings" class="iconBtn" title="Settings">⚙</div>
  </header>

  <section id="settings" class="settings" style="display:none">
    <div id="lblServer" class="label"></div>
    <sp-textfield id="inServer" size="s" placeholder="http://127.0.0.1:8188"></sp-textfield>
    <div id="lblRes" class="label"></div>
    <sp-picker id="inRes" size="s">
      <sp-menu slot="options">
        <sp-menu-item value="512">512 px</sp-menu-item>
        <sp-menu-item value="768">768 px</sp-menu-item>
        <sp-menu-item value="1024">1024 px</sp-menu-item>
        <sp-menu-item value="1536">1536 px</sp-menu-item>
        <sp-menu-item value="2048">2048 px</sp-menu-item>
        <sp-menu-item value="0" id="resFull"></sp-menu-item>
      </sp-menu>
    </sp-picker>
    <div id="hintRes" class="hint"></div>
    <div class="settingsActions"><div id="btnConnect" class="btn"></div></div>
  </section>

  <div id="wfBox" class="wfBox" style="display:none"></div>

  <nav class="tabs">
    <div id="tabGen" class="tab on"></div>
    <div id="tabIo" class="tab"></div>
  </nav>

  <div id="pageGen">
    <div id="previewBox" class="preview">
      <img id="preview" alt="">
      <div id="previewEmpty" class="previewEmpty"></div>
      <div id="liveBadge" class="liveBadge" style="display:none"></div>
      <div id="progress" class="progress"><div id="progressFill"></div></div>
    </div>

    <div class="actions">
      <div id="btnRun" class="btn primary grow"></div>
      <div id="btnCancel" class="btn"></div>
      <div id="chkLive" class="btn toggle"></div>
    </div>
    <div class="actions">
      <div id="btnAddLayer" class="btn"></div>
    </div>

    <div id="empty" class="empty"></div>
    <section id="secParams" style="display:none"><div id="hParams" class="section"></div><div id="params"></div></section>
    <section id="secGroups" style="display:none"><div id="hGroups" class="section"></div><div id="groups"></div></section>
  </div>

  <div id="pageIo" style="display:none">
    <div id="emptyIo" class="empty"></div>
    <section id="secSources" style="display:none"><div id="hSources" class="section"></div><div id="sources"></div></section>
    <section id="secOutputs" style="display:none"><div id="hOutputs" class="section"></div><div id="outputs"></div></section>
  </div>

  <script src="main.js"></script>
</body>
</html>
